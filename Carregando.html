<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click Simulathor</title>
<style>

body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#0b0014,#16002b,#000);
  font-family:Arial;
  color:white;
  text-align:center;
  padding:20px;
  box-sizing:border-box;
}

.titulo{
  font-size:2.2em;
  color:red;
  text-shadow:0 0 10px red,0 0 20px #ff4500;
  margin-bottom:5px;
}

.versao{
  display:inline-block;
  background:#8b0000;
  color:#ffd700;
  padding:6px 14px;
  border-radius:20px;
  border:2px solid #ff4500;
  box-shadow:0 0 12px #ff4500;
  font-size:0.85em;
  margin-bottom:25px;
}

.notas{
  max-width:320px;
  color:#ccc;
  font-size:0.9em;
  margin-bottom:35px;
  line-height:1.5em;
}

.notas b{
  color:#00e5ff;
  text-shadow:0 0 8px #00e5ff;
}

.barra{
  width:250px;
  height:14px;
  background:rgba(0,0,0,0.5);
  border:2px solid #8b5cf6;
  border-radius:10px;
  box-shadow:0 0 15px #8b5cf6;
  overflow:hidden;
}

.progresso{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff4500,#ffd700,#8b5cf6);
  border-radius:10px;
  animation:carregar 2.2s ease forwards;
}

@keyframes carregar{
  from{ width:0%; }
  to{ width:100%; }
}

.texto{
  margin-top:12px;
  color:#ffd700;
  text-shadow:0 0 8px #ffd700;
  font-size:0.95em;
}

.btnEntrar{
  opacity:0;
  pointer-events:none;
  margin-top:20px;
  background:linear-gradient(135deg,#ffd700,#ff8c00);
  color:#000;
  border:none;
  padding:12px 28px;
  border-radius:12px;
  font-weight:bold;
  font-size:1.1em;
  cursor:pointer;
  box-shadow:0 0 15px gold;
  transition:opacity 0.6s ease, transform 0.6s ease;
  transform:translateY(10px);
}

.btnEntrar.visivel{
  opacity:1;
  pointer-events:auto;
  transform:translateY(0);
  animation:pulseEntrar 1.4s infinite alternate;
}

@keyframes pulseEntrar{
  from{ box-shadow:0 0 15px gold; }
  to{ box-shadow:0 0 30px gold, 0 0 45px orange; }
}

</style>
</head>
<body>

<div class="titulo">⚔️ Click Simulathor</div>
<div class="versao">UPDATE 2.0</div>

<div class="notas">
<b>Novidades:</b><br>
✨ Novo sistema de Relíquias Brainrot<br>
🔄 Novo: Auto Giro de relíquias<br>
⚖️ Nerf geral: Ranks, Acessórios, Espadas e Pets<br>
🎯 Chances de relíquia mais equilibradas<br>
Ajustes gerais de estabilidade.<br>
New/Anti-Cheats🙂🚫

</div>

<div class="barra">
  <div class="progresso" id="progresso"></div>
</div>
<div class="texto" id="texto">Carregando...</div>

<button id="btnEntrar" class="btnEntrar" onclick="window.location.href='Game.html'">Entrar ▶️</button>

<script>
document.getElementById("progresso").addEventListener("animationend", function(){
  document.getElementById("texto").innerHTML = "Pronto!"
  document.getElementById("btnEntrar").classList.add("visivel")
})
</script>

</body>
</html>
